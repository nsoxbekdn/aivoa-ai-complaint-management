services:
  db:
    image: postgres:16-alpine
    container_name: aivoa-postgres
    environment:
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
      POSTGRES_DB: aivoa
    ports:
      - '5432:5432'
    volumes:
      - aivoa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aivoa -d aivoa']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aivoa_pgdata:
